name: SemVer Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing or new SemVer release tag, for example v1.2.3'
        required: true
        type: string
      channel:
        description: 'Release channel: stable or beta'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      ref:
        description: 'Git ref to build when dispatching manually'
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: vohive-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ github.ref_name || inputs.version }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      channel: ${{ steps.version.outputs.channel }}
      build_time: ${{ steps.version.outputs.build_time }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve and validate SemVer
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer tag: $VERSION" >&2
            exit 1
          fi
          CHANNEL="$INPUT_CHANNEL"
          if [ -z "$CHANNEL" ]; then
            if [[ "$VERSION" == *-* ]]; then
              CHANNEL=beta
            else
              CHANNEL=stable
            fi
          fi
          case "$CHANNEL" in
            stable)
              if [[ "$VERSION" == *-* ]]; then
                echo "Stable releases must use a final SemVer without a prerelease suffix: $VERSION" >&2
                exit 1
              fi
              ;;
            beta)
              if [[ "$VERSION" != *-* ]]; then
                echo "Beta releases must use a prerelease SemVer such as v1.2.3-beta.1: $VERSION" >&2
                exit 1
              fi
              ;;
            *)
              echo "Invalid release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = beta ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/vohive/web/package-lock.json

      - name: Build frontend for embedding
        working-directory: src/vohive/web
        run: |
          npm ci
          npm run build

      - name: Upload embedded frontend
        uses: actions/upload-artifact@v4
        with:
          name: vohive-web-dist-release-${{ github.run_id }}
          path: src/vohive/web/dist
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build ${{ matrix.artifact_arch }} release assets
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goarch: amd64, goarm: '', artifact_arch: amd64}
          - {goarch: arm64, goarm: '', artifact_arch: arm64}
          - {goarch: arm, goarm: '7', artifact_arch: armv7}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Restore embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: vohive-web-dist-release-${{ github.run_id }}
          path: src/vohive/web/dist

      - name: Prepare embedded frontend directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/vohive/internal/web/dist
          mkdir -p src/vohive/internal/web
          cp -R src/vohive/web/dist src/vohive/internal/web/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/vohive/go.mod
          cache: false

      - name: Create local Go workspace
        working-directory: src
        run: |
          cat > go.work <<'EOF'
          go 1.26.3
          use (
            ./vohive
            ./vowifi-go
            ./swu-go
            ./quectel-qmi-go
            ./netlink
            ./qqbot
            ./euicc-go
            ./uicc-go
          )
          EOF

      - name: Run amd64 release test suite
        if: matrix.artifact_arch == 'amd64'
        working-directory: src/vohive
        run: CGO_ENABLED=0 GOOS=linux go test -tags "with_utls nomsgpack" ./...

      - name: Run VoWiFi runtime and IMS tests
        if: matrix.artifact_arch == 'amd64'
        working-directory: src/vowifi-go
        run: CGO_ENABLED=0 GOOS=linux go test ./...

      - name: Build and package release assets
        working-directory: src/vohive
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
        run: |
          set -euo pipefail
          mkdir -p dist release package
          BINARY="vohive_${VERSION}_linux_${{ matrix.artifact_arch }}"
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" GOARM="$GOARM" \
            go build -trimpath -buildvcs=false -tags "with_utls nomsgpack" \
            -ldflags "-s -w -X github.com/iniwex5/vohive/internal/global.Version=$VERSION -X github.com/iniwex5/vohive/internal/global.BuildTime=$BUILD_TIME -X github.com/iniwex5/vohive/internal/global.Commit=$COMMIT" \
            -o "dist/$BINARY" ./cmd/vohive
          test -s "dist/$BINARY"
          test "$(stat -c '%s' "dist/$BINARY")" -gt 65536
          if [ "$GOARCH" = "amd64" ]; then
            "dist/$BINARY" -h >/dev/null 2>&1
          fi
          cp "dist/$BINARY" "release/$BINARY"
          (cd release && sha256sum "$BINARY" > "$BINARY.sha256")
          cp "dist/$BINARY" package/vohive
          INSTALLER="$GITHUB_WORKSPACE/install.sh"
          test -r "$INSTALLER"
          cp "$INSTALLER" package/install.sh
          chmod 0755 package/vohive package/install.sh
          ARCHIVE="vohive_${VERSION}_linux_${{ matrix.artifact_arch }}.tar.gz"
          tar -czf "release/$ARCHIVE" -C package vohive install.sh
          (cd release && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: vohive-release-${{ matrix.artifact_arch }}-${{ github.run_id }}
          path: src/vohive/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: vohive-release-*
          merge-multiple: true
          path: release

      - name: Validate assets and create manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
        run: |
          set -euo pipefail
          test -n "$(find release -maxdepth 1 -type f | head -n 1)"
          for asset in release/*; do
            test -s "$asset"
          done
          python3 - "$VERSION" "$COMMIT" "$BUILD_TIME" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          version, commit, build_time = sys.argv[1:]
          root = pathlib.Path("release")
          assets = {}
          expected = set()
          for arch in ("amd64", "arm64", "armv7"):
              binary = root / f"vohive_{version}_linux_{arch}"
              archive = root / f"vohive_{version}_linux_{arch}.tar.gz"
              if not binary.is_file() or not archive.is_file():
                  raise SystemExit(f"missing release asset for {arch}")
              expected.update({
                  binary.name,
                  f"{binary.name}.sha256",
                  archive.name,
                  f"{archive.name}.sha256",
              })
              assets[f"linux_{arch}"] = {
                  "name": binary.name,
                  "sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
                  "size": binary.stat().st_size,
                  "archive_name": archive.name,
                  "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
                  "archive_size": archive.stat().st_size,
              }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(
                  f"unexpected release assets: expected {sorted(expected)}, found {sorted(actual)}"
              )
          manifest = {
              "version": version,
              "channel": "${{ needs.prepare.outputs.channel }}",
              "build_time": build_time,
              "commit": commit,
              "minimum_version": version,
              "release_notes": "",
              "assets": assets,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          digest = hashlib.sha256((root / "manifest.json").read_bytes()).hexdigest()
          (root / "manifest.json.sha256").write_text(f"{digest}  manifest.json\n", encoding="utf-8")
          if len(assets) != 3:
              raise SystemExit(f"expected 3 architecture assets, found {len(assets)}")
          PY

      - name: Publish SemVer Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: VoHive ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.channel == 'stable' }}
          fail_on_unmatched_files: true
          files: release/*
