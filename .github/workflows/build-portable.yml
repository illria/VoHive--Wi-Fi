name: Build VoHive portable Linux releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vohive-portable-build
  cancel-in-progress: false

env:
  SOURCE_REPO: hzlmy2002/vohive-collection
  SOURCE_REF: 0c3052c524865a92d546f8fea12d873214c5f8e3

jobs:
  vendor-source:
    name: Vendor pinned source snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Vendor source into src
        shell: bash
        run: |
          set -euo pipefail
          if [ -f src/vohive/go.mod ]; then
            echo "Source snapshot already exists in src/"
            exit 0
          fi
          git clone "https://github.com/${{ env.SOURCE_REPO }}.git" source
          git -C source checkout --detach "${{ env.SOURCE_REF }}"
          mkdir -p src
          for dir in vohive vowifi-go swu-go quectel-qmi-go netlink qqbot euicc-go uicc-go; do
            cp -a "source/$dir" "src/$dir"
            rm -rf "src/$dir/.git"
          done
          cat > src/SOURCE-SNAPSHOT.txt <<EOF
          repository: ${{ env.SOURCE_REPO }}
          commit: ${{ env.SOURCE_REF }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "chore: vendor VoHive source snapshot [skip ci]"
          git push origin HEAD:main

  build:
    name: Build ${{ matrix.artifact_arch }}
    needs: vendor-source
    if: needs.vendor-source.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goarch: amd64, goarm: "", artifact_arch: amd64}
          - {goarch: arm64, goarm: "", artifact_arch: arm64}
          - {goarch: arm, goarm: "7", artifact_arch: armv7}
    steps:
      - name: Checkout vendored source
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/vohive/go.mod
          cache: false
      - name: Build frontend
        working-directory: src/vohive
        run: |
          npm ci --prefix web
          npm run build --prefix web
          rm -rf internal/web/dist
          mkdir -p internal/web
          cp -R web/dist internal/web/dist
      - name: Create local Go workspace
        working-directory: src
        run: |
          cat > go.work <<'EOF'
          go 1.26.3
          use (
            ./vohive
            ./vowifi-go
            ./swu-go
            ./quectel-qmi-go
            ./netlink
            ./qqbot
            ./euicc-go
            ./uicc-go
          )
          EOF
      - name: Build binary
        working-directory: src/vohive
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILDTIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" GOARM="$GOARM" \
            go build -trimpath -buildvcs=false -tags "with_utls nomsgpack" \
            -ldflags "-s -w -X github.com/iniwex5/vohive/internal/global.Version=portable -X github.com/iniwex5/vohive/internal/global.BuildTime=$BUILDTIME" \
            -o dist/vohive ./cmd/vohive
      - name: Package
        env:
          ARCH: ${{ matrix.artifact_arch }}
        run: |
          set -euo pipefail
          rm -rf release package
          mkdir -p release package
          cp src/vohive/dist/vohive package/vohive
          cp install.sh package/install.sh
          chmod 0755 package/vohive package/install.sh
          tar -czf "release/vohive_portable_linux_$ARCH.tar.gz" -C package vohive install.sh
          (cd release && sha256sum "vohive_portable_linux_$ARCH.tar.gz" > "vohive_portable_linux_$ARCH.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: vohive-${{ matrix.artifact_arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release and repository binaries
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vohive-*
          merge-multiple: true
          path: release
      - name: Publish portable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable
          name: VoHive portable builds
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release/*
      - name: Update repository dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release/* dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist is already current"
          else
            git commit -m "build: update portable binaries [skip ci]"
            git push origin HEAD:main
          fi
